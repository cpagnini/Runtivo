<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sei offline — runtivo.</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem 1rem; max-width: 36rem; margin-inline: auto; line-height: 1.5; color: #171717; background: #fff; }
      h1 { font-size: 2rem; letter-spacing: -0.03em; }
      button { font: inherit; font-weight: 600; min-height: 2.75rem; padding: 0.5rem 1.25rem; color: #fff; background: #0f766e; border: 0; border-radius: 0.5rem; }
      @media (prefers-color-scheme: dark) { body { color: #ededed; background: #0a0a0a; } button { color: #042f2e; background: #2dd4bf; } }
    </style>
  </head>
  <body>
    <h1>runtivo.</h1>
    <p>Non c&rsquo;è connessione. Gli orari, i gruppi e le iscrizioni si vedono solo online, così sono sempre aggiornati.</p>
    <button onclick="location.reload()">Riprova</button>
  </body>
</html>
