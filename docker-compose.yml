services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: runtivo
      POSTGRES_USER: runtivo
      POSTGRES_PASSWORD: runtivo_dev
    ports:
      - "5432:5432"
    volumes:
      - runtivo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtivo -d runtivo"]
      interval: 5s
      retries: 10

volumes:
  runtivo-db:
